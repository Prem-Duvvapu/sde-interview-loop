services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    ports:
      - "8123:8123"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./web
    ports:
      - "8130:80"
    depends_on:
      - backend
    restart: unless-stopped
