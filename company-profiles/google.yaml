# Google — SWE L4, India (Bangalore / Hyderabad / Pune)
# CONFIDENCE: seeded-unverified.
id: google
display_name: Google
target_role:
  title: Software Engineer III
  level_code: L4
  location_context: India
difficulty: high

calibration:
  confidence: seeded-unverified
  last_updated: "2026-08-22"
  sources: []
  notes: |
    Seeded from the brief (DSA/GCA-heavy + Googleyness). Two things worth verifying
    early: whether your loop includes a system design round at all (L4 loops sometimes
    do not, and sometimes substitute a second coding round), and how many onsite coding
    rounds you get. Hiring is committee-driven, so there is no single interviewer to win
    over — written feedback quality from every round matters equally.

emphasis:
  dsa: 0.60
  lld: 0.05
  hld: 0.15
  cs_fundamentals: 0.05
  java_deep_dive: 0.0
  behavioral: 0.15

loop:
  total_wall_clock_min: 225
  difficulty_curve: flat
  rounds:
    - ordinal: 1
      module: dsa
      name: Phone screen — coding
      stage: screen
      duration_min: 45
      difficulty_target: medium-hard
      focus_tags: [arrays, strings, recursion, hashing]
      notes: 45 minutes is tight. Time-to-first-correct-approach is a real signal here.
    - ordinal: 2
      module: dsa
      name: Onsite — coding I
      stage: onsite
      duration_min: 45
      difficulty_target: hard
      focus_tags: [graphs, dp, greedy, sorting-invariants]
    - ordinal: 3
      module: dsa
      name: Onsite — coding II
      stage: onsite
      duration_min: 45
      difficulty_target: medium-hard
      focus_tags: [trees, intervals, binary-search-on-answer, tries]
    - ordinal: 4
      module: hld
      name: Onsite — system design
      stage: onsite
      duration_min: 45
      difficulty_target: medium
      focus_tags: [api-design, storage-choice, estimation]
      notes: Scoped lighter than a senior loop. Verify whether your loop includes this.
    - ordinal: 5
      module: behavioral
      name: Googleyness & Leadership
      stage: onsite
      duration_min: 45
      difficulty_target: medium
      enabled_in_v1: false
      notes: Out of v1 module scope — full-loop mode announces and skips it.

quirks:
  - id: gca-articulation
    label: General Cognitive Ability — think aloud or lose the signal
    description: >
      Google explicitly scores structured problem-solving, not just the final answer.
      Silence while solving reads as no signal, even when the code lands.
    applies_to_rounds: [1, 2, 3]
    interviewer_behavior: |
      Score the candidate's *process*, not only the outcome. If they go silent for more
      than a short stretch, prompt once: "Talk me through what you're considering."
      If they jump straight to an optimal solution with no stated reasoning, ask them to
      justify why the brute force fails and how they got from there to here — an
      unexplained optimal answer earns partial credit at best, and say so in feedback.
  - id: hiring-committee
    label: Committee decides, not the interviewer
    description: >
      No interviewer can champion you through. Every round produces independent written
      feedback; consistency across rounds matters more than one standout performance.
  - id: follow-up-extension
    label: Expect a hard follow-up on every problem
    description: >
      Solving the stated problem usually earns a constraint change ("now the input
      doesn't fit in memory", "now it's streaming") in the remaining time.
    applies_to_rounds: [1, 2, 3]
    interviewer_behavior: |
      Once the candidate has a working, analyzed solution, always introduce a constraint
      change with the remaining time — unbounded input, streaming arrival, distributed
      across machines, or a tightened complexity bound. Their handling of the extension
      is a first-class part of the score.

readiness:
  bar_band: hire
  module_minimums:
    dsa: 4.0
  min_sessions_for_confidence: 4
