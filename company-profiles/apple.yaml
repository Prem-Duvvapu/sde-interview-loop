# Apple — ICT3 (SDE-2 equivalent), India (Hyderabad / Bangalore)
# CONFIDENCE: seeded-unverified. Apple loops are the least standardized in this directory.
id: apple
display_name: Apple
target_role:
  title: Software Engineer
  level_code: ICT3 (SDE-2 equivalent)
  location_context: India (Hyderabad / Bangalore)
difficulty: medium-high

calibration:
  confidence: seeded-unverified
  last_updated: "2026-08-22"
  sources: []
  notes: |
    Seeded from the brief (deep technical + system design). Apple is the profile most
    likely to be wrong, because loops are owned by individual teams rather than a
    central process — round count, format, and emphasis all vary by org. Treat this as a
    generic deep-technical loop until you know the team. If you learn the team, consider
    forking this into apple-<team>.yaml rather than overwriting.

    LEVEL NOTE: the seed table listed Apple as "ICT3/ICT4". ICT4 is the senior band; at
    ~2 years of experience ICT3 is the SDE-2-equivalent target, so this profile is
    calibrated to ICT3 and the fundamentals round is scoped medium-hard rather than
    hard.

emphasis:
  dsa: 0.30
  lld: 0.20
  hld: 0.25
  cs_fundamentals: 0.15
  java_deep_dive: 0.05
  behavioral: 0.05

loop:
  total_wall_clock_min: 315
  difficulty_curve: spiky
  rounds:
    - ordinal: 1
      module: dsa
      name: Recruiter-arranged technical screen
      stage: screen
      duration_min: 45
      difficulty_target: medium
      focus_tags: [arrays, strings, hashing]
    - ordinal: 2
      module: dsa
      name: Onsite — coding
      stage: onsite
      duration_min: 60
      difficulty_target: medium-hard
      focus_tags: [trees, graphs, dp, bit-manipulation]
    - ordinal: 3
      module: cs_fundamentals
      name: Onsite — fundamentals & domain depth
      stage: onsite
      duration_min: 60
      difficulty_target: medium-hard
      focus_tags: [concurrency, memory-model, os-internals, performance]
      notes: The spike in the curve. Depth-first on whatever the team cares about.
    - ordinal: 4
      module: hld
      name: Onsite — system design
      stage: onsite
      duration_min: 60
      difficulty_target: medium-hard
      focus_tags: [reliability, latency-budgets, data-modelling, privacy]
    - ordinal: 5
      module: lld
      name: Onsite — design & implementation
      stage: onsite
      duration_min: 60
      difficulty_target: medium-hard
      focus_tags: [oop, api-design, resource-management]
    - ordinal: 6
      module: behavioral
      name: Team fit / "why Apple"
      stage: final
      duration_min: 30
      difficulty_target: easy
      enabled_in_v1: false

quirks:
  - id: team-owned-loop
    label: The team, not a central process, defines the loop
    description: >
      Round composition and emphasis vary sharply between orgs. Ask the recruiter what
      the specific team's loop looks like and re-seed this profile before relying on it.
  - id: depth-over-breadth
    label: Interviewers go deep on one thing until you break
    description: >
      Rather than sampling many topics, Apple interviewers commonly pick one and keep
      descending. The scored signal is where you stop being able to answer, and how
      honestly you signal that boundary.
    applies_to_rounds: [3, 4, 5]
    interviewer_behavior: |
      Go depth-first, not breadth-first. Pick one thread and keep descending until the
      candidate reaches the edge of their knowledge — that boundary is the round's
      primary measurement, so find it deliberately rather than avoiding it. Reaching a
      limit is expected and not itself a negative. What you are scoring at that point is
      honesty: a clean "I don't know, here's how I'd find out" scores well, and
      confident bluffing scores very badly — call it out in feedback when it happens.
  - id: privacy-framing
    label: Privacy and on-device constraints appear in design rounds
    description: >
      Design prompts often add data-minimization, on-device processing, or
      no-server-side-PII constraints.
    applies_to_rounds: [4]

readiness:
  bar_band: hire
  module_minimums:
    dsa: 3.5
    hld: 3.5
    cs_fundamentals: 3.5
  min_sessions_for_confidence: 4
