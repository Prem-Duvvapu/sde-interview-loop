  notes: |
    Seeded from the brief (DSA + scale-heavy HLD). Retail-scale framing (catalog,
    inventory, order management, peak-season traffic) is the recurring theme.

    LEVEL NOTE: the seed table listed Walmart as "SWE-4/Sr". That is the senior band;
