quirks:
  - id: retail-peak-load
    label: Peak-load framing is the recurring theme
    description: >
      Expect the design prompt to include a seasonal traffic spike an order of magnitude
      above baseline. Designs that only work at average load fail this round.
    applies_to_rounds: [3]
    interviewer_behavior: |
      Frame the design in a retail context — catalog, cart, inventory, or order
      management. Once the candidate has a baseline design, impose a seasonal peak an
      order of magnitude above normal traffic and make them show what breaks first and
      how they'd absorb it. Push specifically on inventory correctness under concurrent
      purchase — overselling is the canonical failure and they should reach for
      reservations, optimistic locking, or an equivalent mechanism by name.
  - id: cost-consciousness
    label: Cost of the design comes up
    description: >
      Unlike pure scale interviews, Walmart rounds often ask what the architecture costs
      to run and where you'd trade latency for money.
    applies_to_rounds: [3]

readiness:
  bar_band: hire
  module_minimums:
    hld: 3.5
    dsa: 3.5
  min_sessions_for_confidence: 3
