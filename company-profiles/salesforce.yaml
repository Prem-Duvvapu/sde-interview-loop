quirks:
  - id: java-depth-is-the-bar
    label: Java internals depth is the differentiator
    description: >
      Expect to go several layers below API usage — HashMap resize semantics, the
      memory model, executor tuning, why a Spring bean behaves as it does.
    applies_to_rounds: [3]
    interviewer_behavior: |
      Probe below API usage into implementation. Follow every correct answer with "why
      is it implemented that way?" and "what breaks if it weren't?" Anchor questions in
      concrete scenarios — a service degrading under load, an unexpected NPE after a
      refactor — never in definition recall. The candidate has substantial Spring Boot
      project experience, so treat framework-level answers as the starting point and
      push to the JVM and concurrency layer beneath them.
  - id: multi-tenancy-flavour
    label: Multi-tenancy shows up in design questions
    description: >
      Given Salesforce's platform model, design questions often add a tenant-isolation
      or noisy-neighbour constraint.
    applies_to_rounds: [4]

readiness:
