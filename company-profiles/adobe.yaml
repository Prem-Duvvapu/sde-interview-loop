# Adobe — MTS-2 (Computer Scientist 2), India (Noida / Bangalore)
# CONFIDENCE: seeded-unverified.
id: adobe
display_name: Adobe
target_role:
  title: Computer Scientist 2 / MTS-2
  level_code: MTS-2
  location_context: India (Noida / Bangalore)
difficulty: medium

calibration:
  confidence: seeded-unverified
  last_updated: "2026-08-22"
  sources: []
  notes: |
    Seeded from the brief (DSA + CS fundamentals). Adobe is the profile where the CS
    fundamentals module carries real weight — OS, DBMS, and networking questions appear
    as their own round rather than as filler. Verify whether your loop opens with a
    written/online round; several Adobe India loops do.

emphasis:
  dsa: 0.40
  lld: 0.15
  hld: 0.10
  cs_fundamentals: 0.25
  java_deep_dive: 0.05
  behavioral: 0.05

loop:
  total_wall_clock_min: 240
  difficulty_curve: front-loaded
  rounds:
    - ordinal: 1
      module: dsa
      name: Online assessment / written round
      stage: screen
      duration_min: 60
      difficulty_target: medium
      focus_tags: [arrays, strings, complexity-analysis, output-prediction]
      notes: >
        Often includes non-coding items — complexity questions, code output prediction,
        aptitude. The interviewer runs this as a mixed rapid-fire + coding round.
    - ordinal: 2
      module: dsa
      name: Onsite — coding I
      stage: onsite
      duration_min: 60
      difficulty_target: medium-hard
      focus_tags: [trees, linked-lists, recursion, dp]
    - ordinal: 3
      module: cs_fundamentals
      name: Onsite — CS fundamentals
      stage: onsite
      duration_min: 45
      difficulty_target: medium
      focus_tags: [os-processes-threads, virtual-memory, dbms-indexing, transactions, tcp-ip]
      notes: Rapid-fire and adaptive; depth follows the strength of each answer.
    - ordinal: 4
      module: lld
      name: Onsite — design
      stage: onsite
      duration_min: 45
      difficulty_target: medium
      focus_tags: [oop, design-patterns]
    - ordinal: 5
      module: behavioral
      name: Hiring manager round
      stage: final
      duration_min: 30
      difficulty_target: easy
      enabled_in_v1: true

quirks:
  - id: fundamentals-as-a-gate
    label: CS fundamentals is a standalone scored round
    description: >
      Unlike most product companies, Adobe treats OS/DBMS/networking as its own round.
      Rusty fundamentals are visible here in a way they are not elsewhere.
    applies_to_rounds: [3]
    interviewer_behavior: |
      Run this as adaptive rapid-fire. Start broad; each correct answer earns one level
      deeper on the same thread before you move on, each shaky answer earns a lateral
      move to an adjacent topic. Cover OS, DBMS, and networking within the round rather
      than exhausting one. Prefer "why" over "what" — why a B+ tree rather than a hash
      index, why context switching costs what it does. Track depth reached per topic
      separately; breadth with no depth and depth in one area with no breadth are
      different failure modes and should be reported differently.
  - id: complexity-rigour
    label: Explicit complexity analysis expected
    description: >
      Expect to be asked to derive, not assert, time and space complexity — including
      for recursive and amortized cases.
    applies_to_rounds: [1, 2]

readiness:
  bar_band: hire
  module_minimums:
    dsa: 3.5
    cs_fundamentals: 3.5
  min_sessions_for_confidence: 3
