# Microsoft — SDE-2 (L62), India (IDC Hyderabad / Bangalore / Noida)
# CONFIDENCE: seeded-unverified. Correct from real data; add a dated entry to calibration.sources.
id: microsoft
display_name: Microsoft
target_role:
  title: Software Engineer II
  level_code: L62
  location_context: India Development Center
difficulty: medium-high

calibration:
  confidence: seeded-unverified
  last_updated: "2026-08-22"
  sources: []
  notes: |
    Seeded from the project brief (DSA + LLD, some HLD). Microsoft loops vary
    considerably by org — Azure orgs lean HLD/distributed-systems, product orgs lean
    LLD. The "As Appropriate" (AA) round is the item most worth verifying: whether it
    exists in your loop and who runs it changes the whole difficulty curve.

emphasis:
  dsa: 0.40
  lld: 0.30
  hld: 0.15
  cs_fundamentals: 0.05
  java_deep_dive: 0.05
  behavioral: 0.05

loop:
  total_wall_clock_min: 285
  difficulty_curve: rising
  rounds:
    - ordinal: 1
      module: dsa
      name: Phone screen — coding
      stage: screen
      duration_min: 60
      difficulty_target: medium
      focus_tags: [arrays, strings, hashing, two-pointers, trees]
      notes: One or two problems. Clean working code matters more than optimal-on-first-try.
    - ordinal: 2
      module: dsa
      name: Onsite — coding I
      stage: onsite
      duration_min: 60
      difficulty_target: medium-hard
      focus_tags: [graphs, dp, intervals, heaps]
    - ordinal: 3
      module: lld
      name: Onsite — design & implementation
      stage: onsite
      duration_min: 60
      difficulty_target: medium-hard
      focus_tags: [oop, solid, extensibility, api-surface]
      notes: Often "design X, then implement the core class" rather than pure diagramming.
    - ordinal: 4
      module: hld
      name: Onsite — system design
      stage: onsite
      duration_min: 45
      difficulty_target: medium
      focus_tags: [caching, queues, storage-choice]
      notes: At L62 this is usually scoped narrower than a full SDE-3 HLD round.
    - ordinal: 5
      module: behavioral
      name: As Appropriate (AA) round
      stage: final
      duration_min: 60
      difficulty_target: medium-hard
      enabled_in_v1: false
      notes: >
        Senior interviewer with decision authority; mixes behavioral with a deep dive
        anywhere they choose. Out of v1 module scope — full-loop mode will announce and
        skip it.

quirks:
  - id: as-appropriate-round
    label: '"As Appropriate" final round'
    description: >
      A senior IC or manager who joins late in the loop with effective veto power. Can
      re-open any earlier topic, and often probes ownership and past-project depth.
    applies_to_rounds: [5]
  - id: implement-dont-just-diagram
    label: Design rounds expect real code
    description: >
      Microsoft design rounds frequently pivot from diagram to "now write the class."
      Candidates who stay at the box-and-arrow level under-perform.
    applies_to_rounds: [3]
    interviewer_behavior: |
      After the candidate has sketched their class model, pivot: pick the single most
      interesting class and ask them to implement it fully, including method signatures
      and the trickiest method body. Do not accept pseudocode. Judge the code as code.
  - id: org-variance
    label: High org-to-org variance
    description: >
      Round composition depends heavily on the hiring org. Confirm the loop with the
      recruiter before treating this profile's sequence as fixed.

readiness:
  bar_band: hire
  module_minimums:
    dsa: 3.5
    lld: 3.5
  min_sessions_for_confidence: 3
