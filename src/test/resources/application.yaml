server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    # Match production: lazy associations must fail here if they would fail at runtime
    # (AGENTS.md invariant 6). Spring Boot's default of true would hide that class of bug.
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  profiles-dir: company-profiles
  providers-config: config/providers.yaml
