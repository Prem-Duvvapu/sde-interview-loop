server:
  port: 8080

spring:
  application:
    name: interview-loop

  datasource:
    url: jdbc:h2:file:./data/interview-loop;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      # Default is 1MB, which rejects most real PDFs. ResumeService enforces its own
      # 10MB cap; this just has to be at least that.
      max-file-size: 10MB
      max-request-size: 10MB

# Application-specific config
app:
  profiles-dir: company-profiles
  providers-config: config/providers.yaml
