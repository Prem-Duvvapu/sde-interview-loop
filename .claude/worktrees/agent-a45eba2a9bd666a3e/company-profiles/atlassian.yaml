# Atlassian — P50 (Software Engineer), India (Bangalore) / remote-friendly
# CONFIDENCE: seeded-unverified.
id: atlassian
display_name: Atlassian
target_role:
  title: Software Engineer
  level_code: P50
  location_context: India (Bangalore), remote-friendly
difficulty: medium-high

calibration:
  confidence: seeded-unverified
  last_updated: "2026-08-22"
  sources: []
  notes: |
    Seeded from the brief (LLD + values round). The Values round is Atlassian's most
    distinctive feature and is scored as a real round — it is not a formality. Verify
    the coding round format: Atlassian often runs a longer, IDE-based, build-something
    round rather than a whiteboard algorithm round.

emphasis:
  dsa: 0.25
  lld: 0.35
  hld: 0.15
  cs_fundamentals: 0.05
  java_deep_dive: 0.05
  behavioral: 0.15

loop:
  total_wall_clock_min: 300
  difficulty_curve: flat
  rounds:
    - ordinal: 1
      module: dsa
      name: Online assessment / coding screen
      stage: screen
      duration_min: 60
      difficulty_target: medium
      focus_tags: [arrays, strings, hashing, simulation]
    - ordinal: 2
      module: lld
      name: Onsite — coding & craft (build something)
      stage: onsite
      duration_min: 90
      difficulty_target: medium-hard
      focus_tags: [oop, testability, incremental-delivery, refactoring]
      notes: >
        Extended, IDE-based. Scored on working software and code craft — naming, tests,
        commit-sized increments — more than on algorithmic cleverness.
    - ordinal: 3
      module: lld
      name: Onsite — system/object design
      stage: onsite
      duration_min: 60
      difficulty_target: medium-hard
      focus_tags: [solid, extensibility, api-surface, concurrency]
    - ordinal: 4
      module: hld
      name: Onsite — architecture
      stage: onsite
      duration_min: 45
      difficulty_target: medium
      focus_tags: [service-boundaries, multi-tenancy, availability]
    - ordinal: 5
      module: behavioral
      name: Values round
      stage: final
      duration_min: 45
      difficulty_target: medium
      enabled_in_v1: false
      notes: >
        Scored independently against Atlassian's published values; a weak Values round
        can sink an otherwise strong loop. Out of v1 module scope.

quirks:
  - id: values-round-is-real
    label: Values round can fail you on its own
    description: >
      Unlike a soft culture-fit chat, this is a structured, separately scored round.
      Prepare stories mapped to Atlassian's published values with the same rigour as a
      design round.
    applies_to_rounds: [5]
  - id: craft-over-cleverness
    label: Code craft is the scored dimension
    description: >
      Tests, naming, small commits, and handling a mid-round requirement change matter
      more than reaching the optimal algorithm.
    applies_to_rounds: [2]
    interviewer_behavior: |
      Score code craft first: naming, small verifiable increments, tests written
      alongside the code, and honest handling of edge cases. Roughly two-thirds of the
      way through, introduce a requirement change that a well-factored design absorbs
      cheaply and a rushed one does not. How they absorb that change is the round's
      central signal — note explicitly whether their earlier structure paid off or cost
      them.
  - id: collaboration-probe
    label: Interviewer behaves as a pair, not an examiner
    description: >
      Expect the interviewer to offer opinions and occasionally suggest a worse
      approach. Disagreeing well — and being persuadable on evidence — is scored.
    applies_to_rounds: [2, 3]
    interviewer_behavior: |
      Behave as a collaborator, not an examiner. At least once, propose a plausible but
      inferior alternative and see whether the candidate evaluates it on merit — do they
      cave to seniority, or reject it without engaging? Both are negative signals; note
      which. Reward reasoned disagreement and genuine updating on evidence.

readiness:
  bar_band: hire
  module_minimums:
    lld: 3.5
  min_sessions_for_confidence: 3
