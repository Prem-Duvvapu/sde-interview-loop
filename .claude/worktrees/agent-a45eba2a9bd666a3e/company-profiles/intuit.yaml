quirks:
  - id: correctness-over-cleverness
    label: Financial-domain correctness framing
    description: >
      Money, tax, and ledger domains push toward auditability, idempotency, and exact
      arithmetic. Floating-point currency and non-idempotent writes are hard negatives.
    applies_to_rounds: [3, 4]
    interviewer_behavior: |
      Frame design prompts in a financial domain where correctness dominates. Probe
      idempotency of writes, auditability of state changes, and exact-arithmetic
      handling of money. Treat a floating-point money type or a non-idempotent payment
      path as a significant defect and pursue it until the candidate either fixes it or
      demonstrates why it is safe here.
  - id: customer-obsession-probe
    label: Expect "who is the user" questions in design rounds
    description: >
      Design discussions frequently detour into user impact and failure-mode
      consequences for the end customer. Purely technical answers score lower.
    applies_to_rounds: [3, 4]

