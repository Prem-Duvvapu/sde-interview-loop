# LLM provider configuration.
#
# DATA, NOT CODE — edit freely; no rebuild required.
#
# You supply the API keys. This app adds no service of its own and imposes no cost
# beyond your own usage. A provider whose key is absent is simply hidden in the UI —
# it is not an error and needs no configuration.
#
# Keys are read from the environment (a local .env), never committed, never sent to the
# browser. Only the env var NAME appears here.
#
# DEFAULT PROVIDER: Google Gemini. Claude remains configured as an alternative
# interviewer, but is not the default. (Development of this repo is done with Claude
# Code — that is tooling, unrelated to which model the product itself calls.)
#
# MODEL IDs: Gemini and Anthropic entries are filled in with verified current models
# (checked 2026-08-22). OpenAI and DeepSeek are left as <set-me> rather than guessed —
# vendor model IDs change often, so copy the current one from that vendor's own docs
# when you add its key.

defaults:
  # The evaluator is PINNED for score comparability (see PROJECT_PLAN.md §1.5).
  # Changing it starts a new comparability epoch and is flagged on the dashboard.
  evaluator:
    provider: google
    model: gemini-3.7-flash
    comparability_epoch: 1

  # The interviewer may differ per session — pick it in the UI when starting a round.
  interviewer:
    provider: google
    model: gemini-3.7-flash

providers:
  - id: anthropic
    display_name: Claude
    enabled: true                   # available as an alternative interviewer, not the default
    api_key_env: ANTHROPIC_API_KEY
    sdk: com.anthropic:anthropic-java
    models:
      - id: claude-opus-5
        role_hint: interviewer, evaluator
        # Adaptive thinking; per-module effort is set by the module, not here.
        thinking: adaptive
        context_tokens: 1000000
    capabilities:
      streaming: true
      tool_use: true
      prompt_caching: explicit      # cache_control breakpoints
      vision: true
    pricing_usd_per_mtok:
      input: 5.00
      output: 25.00

  - id: openai
    display_name: OpenAI
    enabled: false                  # flips to true once the key is present
    api_key_env: OPENAI_API_KEY
    models:
      - id: <set-me>
        role_hint: interviewer
    capabilities:
      streaming: true
      tool_use: true
      prompt_caching: automatic     # automatic prefix caching
      vision: true
    pricing_usd_per_mtok:
      input: <set-me>
      output: <set-me>

  - id: google
    display_name: Gemini
    enabled: true                   # DEFAULT provider for interviewer and evaluator
    api_key_env: GEMINI_API_KEY   # falls back to GOOGLE_API_KEY if unset
    sdk: Google official Java SDK — confirm artifact coordinates when building the adapter
    models:
      - id: gemini-3.7-flash
        role_hint: interviewer, evaluator
        notes: >
          Default. Google describes it as their strongest workhorse model for coding and
          agentic work. In preview as of 2026-08-22 — confirm your key has access, and
          expect preview models to move.
      - id: gemini-3.6-flash
        role_hint: interviewer
        notes: Cheaper, more token-efficient. Fallback if 3.7 is unavailable.
      - id: gemini-3.5-flash-lite
        role_hint: summariser
        notes: Low-latency, low-cost. Candidate for transcript summarisation only.
    capabilities:
      streaming: true
      tool_use: true
      prompt_caching: explicit      # explicit context caching — TTL-based cached-content
                                    # objects with a minimum token floor; semantics differ
                                    # from Anthropic breakpoints. The adapter owns this.
      vision: true
    pricing_usd_per_mtok:
      input: <set-me>               # fill from Google's pricing page for your tier
      output: <set-me>

  - id: deepseek
    display_name: DeepSeek
    enabled: false
    api_key_env: DEEPSEEK_API_KEY
    models:
      - id: <set-me>
        role_hint: interviewer
    capabilities:
      streaming: true
      tool_use: true
      prompt_caching: automatic
      vision: false
    pricing_usd_per_mtok:
      input: <set-me>
      output: <set-me>

# Capability floor enforced at the provider SPI boundary.
# A provider failing these is either shimmed (degraded, flagged in the UI) or blocked
# from interviewer duty — it must never silently break the round phase machine.
capability_floor:
  interviewer: [streaming, tool_use]
  evaluator: [tool_use]

# Voice providers mirror the same shape (PROJECT_PLAN.md DM-1).
# The default needs no key and costs nothing.
voice:
  default: web-speech-api
  providers:
    - id: web-speech-api
      display_name: Browser (Web Speech API)
      enabled: true
      api_key_env: null
      notes: >
        Zero cost, zero key, zero RAM. Robotic TTS, no barge-in, weak on technical
        vocabulary. Chrome's implementation sends audio to Google's servers — this is
        browser-native, not local.
    - id: openai-speech
      display_name: OpenAI speech
      enabled: false
      api_key_env: OPENAI_API_KEY   # reuses a key you already supplied — no new vendor
    - id: gemini-live
      display_name: Gemini Live
      enabled: false
      api_key_env: GEMINI_API_KEY
