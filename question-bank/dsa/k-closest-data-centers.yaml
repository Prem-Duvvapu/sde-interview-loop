slug: k-closest-data-centers
title: K Closest Data Centers
difficulty: medium-hard
tags:
  - heap
  - sorting
  - quickselect

statement: >
  A routing service needs to pick which data centers to prefer for a client at
  coordinate (0, 0) on a 2D map (units are arbitrary; Euclidean distance is what
  matters, latency isn't modeled). You're given the coordinates of `n` data centers
  and an integer `k`. Return the `k` data centers closest to the client, in any
  order.

constraints:
  - "1 <= k <= centers.length <= 10^5"
  - "-10^4 <= x, y <= 10^4"
  - "There may be duplicate coordinates."

example: |
  centers = [[1,3], [-2,2], [5,8], [0,1]], k = 2
  → [[-2,2], [0,1]]   (distances: sqrt(10), sqrt(8), sqrt(89), sqrt(1) → closest two are [0,1] and [-2,2])

interviewer_notes: >
  Intended solution: a max-heap of size k over squared distance (never take an actual
  sqrt — it's monotonic and just burns cycles/precision), giving O(n log k). Full sort
  is a correct O(n log n) fallback and fine as a first answer. Quickselect gets it to
  expected O(n) and is a strong signal if the candidate reaches for it unprompted, but
  should not be expected without a nudge — this is where SET_HINT_LEVEL earns its keep:
  if they're stuck after a solid heap solution, a level-1 hint ("can you do better than
  log n per element?") is enough; do not hand them quickselect outright.
  Push on the squared-distance point specifically in COMPLEXITY — a candidate computing
  real Euclidean distance with sqrt for every comparison is a correctness-adjacent
  efficiency miss worth recording as its own signal.
