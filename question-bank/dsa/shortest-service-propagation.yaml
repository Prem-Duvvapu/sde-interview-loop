slug: shortest-service-propagation
title: Shortest Service Propagation
difficulty: medium-hard
tags:
  - graphs
  - dijkstra
  - bfs
  - shortest-path

statement: >
  A microservice cluster has `n` services numbered `0` to `n-1`. When a configuration
  update is published from a source service, it propagates along directed inter-service
  links, each with a latency in milliseconds. A service processes the update the moment
  the first copy reaches it (if multiple paths exist, the fastest one wins).

  Given the number of services `n`, a list of directed links as `[from, to, latency]`,
  and the source service `src`, return the minimum time in milliseconds until every
  service has received the update. If any service is unreachable from `src`, return -1.

constraints:
  - "1 <= n <= 100"
  - "0 <= links.length <= n * (n - 1)"
  - "links[i] = [from, to, latency]"
  - "0 <= from, to < n, from != to"
  - "1 <= latency <= 100"
  - "No duplicate edges (same from, same to)"

example: |
  n = 4, links = [[0,1,5], [0,2,3], [2,1,1], [1,3,2]], src = 0

  Paths from 0:
    to 1: direct = 5ms, via 2 = 3+1 = 4ms  → best: 4ms
    to 2: direct = 3ms                       → best: 3ms
    to 3: via 1 (via 2) = 4+2 = 6ms          → best: 6ms

  All services reached. Answer is max(4, 3, 6) = 6

  n = 3, links = [[0,1,2]], src = 0
  → -1  (service 2 is unreachable from 0)

interviewer_notes: >
  Intended solution: Dijkstra's shortest-path from src, then return the maximum of
  all shortest distances (since the last service to receive the update determines the
  total propagation time). O((V + E) log V) with a min-heap. BFS alone does not work
  because edges have non-uniform weights — probing whether the candidate recognises this
  is a strong signal. If a candidate reaches for BFS first, ask "what if two paths have
  different total latencies?" and see if they correct to Dijkstra or Bellman-Ford.
  Bellman-Ford at O(V*E) is a correct alternative but slower; ask them to compare.
  Common pitfalls: (1) forgetting that it's a directed graph — a link from A to B does
  not imply B can reach A, (2) returning the sum of distances instead of the max (the
  update propagates in parallel, so total time is the slowest path, not the sum),
  (3) not handling the unreachable case — check if any dist[] remains infinity.
  The n <= 100 constraint means even O(n^3) Floyd-Warshall would pass, but the candidate
  should still reason about asymptotic complexity in COMPLEXITY phase. A follow-up
  worth asking: "what if latencies could be zero?" — Dijkstra still works since edges
  are non-negative.
